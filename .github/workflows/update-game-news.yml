name: Update Game News Snapshot

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 2 * * *"

concurrency:
  group: update-game-news
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch previous state from game-data branch
        run: |
          if git ls-remote --exit-code --heads origin game-data > /dev/null 2>&1; then
            git fetch origin game-data --depth 1
            git show origin/game-data:data/game-news-state.json > /tmp/previous-state.json || echo "{}" > /tmp/previous-state.json
            echo "Loaded previous state from game-data branch"
          else
            echo "{}" > /tmp/previous-state.json
            echo "No game-data branch yet; will bootstrap from seed"
          fi

      - name: Run game news pipeline
        run: |
          python scripts/update_game_news.py \
            --output data/game-news.json \
            --state data/game-news-state.json \
            --previous-state /tmp/previous-state.json \
            --seed data/game-news-seed.json

      - name: Push snapshot to orphan game-data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Build a single parentless commit containing only the two output
          # files, without touching the master working tree at all. Force-
          # pushing this each run means game-data never accumulates history -
          # old commits become unreachable and get garbage collected, so a
          # normal fetch/pull only ever pulls the current snapshot's size,
          # never the AI News archive.json git-bloat mistake repeated here.
          BLOB_DATA=$(git hash-object -w data/game-news.json)
          BLOB_STATE=$(git hash-object -w data/game-news-state.json)
          DATA_TREE=$(printf "100644 blob %s\tgame-news.json\n100644 blob %s\tgame-news-state.json\n" "$BLOB_DATA" "$BLOB_STATE" | git mktree)
          ROOT_TREE=$(printf "040000 tree %s\tdata\n" "$DATA_TREE" | git mktree)
          COMMIT=$(git commit-tree "$ROOT_TREE" -m "game-data snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)")
          git push origin "$COMMIT:refs/heads/game-data" --force
